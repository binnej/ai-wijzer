<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Afbeeldingen kopiëren</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .page {
            width: 100%;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            margin: 0 0 20px;
            font-size: 28px;
        }

        /*
         * Schakelaar
         */
        .mode-switch {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: #888;
            border-radius: 28px;
            transition: 0.2s;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }

        .switch input:checked + .slider {
            background: #4d90fe;
        }

        .switch input:checked + .slider:before {
            transform: translateX(24px);
        }

         * Afbeeldingen
         *
         * Altijd 4 kolommen.
